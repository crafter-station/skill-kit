name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/cli/package.json"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Detect version change
        id: version
        run: |
          LOCAL=$(jq -r .version package.json)
          PUBLISHED=$(npm view @crafter/skillkit version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $PUBLISHED -> $LOCAL"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($LOCAL), skipping publish"
          fi

      - name: Install
        if: steps.version.outputs.changed == 'true'
        working-directory: .
        run: bun install --frozen-lockfile

      # The published skill must not advertise a version it does not describe.
      - name: Check skill version matches
        if: steps.version.outputs.changed == 'true'
        working-directory: .
        run: bun run skill:version

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public

      - name: Changelog since last tag
        if: steps.version.outputs.changed == 'true'
        id: changelog
        working-directory: .
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE=${LAST_TAG:+$LAST_TAG..HEAD}
          {
            echo "body<<CHANGELOG_EOF"
            git log $RANGE --pretty="- %s (%h)" --no-merges | grep -E "^- (feat|fix|perf|refactor|docs|chore)" || git log $RANGE --pretty="- %s (%h)" --no-merges | head -20
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: steps.version.outputs.changed == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.local }}" \
            --title "v${{ steps.version.outputs.local }}" \
            --notes "${{ steps.changelog.outputs.body }}"
